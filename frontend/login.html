<!DOCTYPE html>
<html>
<head>
    <title>StockIQ Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>StockIQ Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button
            class="btn"
            onclick="login()"
        >
            Login
        </button>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
