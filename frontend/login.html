<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>StockIQ Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-page">

    <div class="login-left">

        <div class="brand">

            <h1>StockIQ</h1>

            <p>
                AI-Powered Inventory Management System
            </p>

        </div>

        <div class="features">

            <div class="feature">
                📦 Smart Inventory Tracking
            </div>

            <div class="feature">
                📊 Real-time Analytics
            </div>

            <div class="feature">
                🤖 ML-based Stock Forecasting
            </div>

        </div>

    </div>

    <div class="login-right">

        <div class="login-card">

            <h2>Welcome Back 👋</h2>

            <p>
                Sign in to continue
            </p>

            <input
                type="email"
                id="email"
                placeholder="Email Address"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button
                class="btn-login"
                onclick="login()"
            >
                Sign In
            </button>

        </div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
